name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "CHANGELOG.md"
      - ".github/workflows/publish.yml"

concurrency:
  group: publish-maven
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: mvn -B test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: maven
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve version and decide whether to release
        id: version
        run: |
          set -euo pipefail
          POM_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAVA_VERSION="$(grep -E 'STRING\s*=\s*"' src/main/java/com/praxicraft/assess/Version.java | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$POM_VERSION" != "$JAVA_VERSION" ]; then
            echo "::error::pom.xml version ($POM_VERSION) != Version.STRING ($JAVA_VERSION)"
            exit 1
          fi
          TAG="v${POM_VERSION}"
          {
            echo "version=$POM_VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $POM_VERSION — will tag and publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release tag
        if: steps.version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish to GitHub Packages
        if: steps.version.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B -DskipTests deploy

      - name: Package JAR for release assets
        if: steps.version.outputs.should_publish == 'true'
        run: mvn -B -DskipTests package

      - name: Create GitHub Release
        if: steps.version.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            target/assess-*.jar
