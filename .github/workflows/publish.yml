name: Publish

# Release via tags only. Bump version in pom.xml / Version.java on main, tag, then push tag or workflow_dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.0). Required for manual runs."
        required: true
        type: string

concurrency:
  group: publish-maven
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: mvn -B test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: maven
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Tag must look like v1.0.0 (got: $TAG)"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (artifact version ${VERSION})"

      - name: Verify package version matches tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          POM=$(grep -A2 '<artifactId>assess</artifactId>' pom.xml | grep '<version>' | head -1 | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          JAVA_VER=$(grep 'STRING' src/main/java/com/praxicraft/assess/Version.java | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$POM" != "$VERSION" ] || [ "$JAVA_VER" != "$VERSION" ]; then
            echo "Version mismatch: tag v${VERSION}, pom.xml=${POM}, Version.java=${JAVA_VER}"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B -DskipTests deploy
      - run: mvn -B -DskipTests package
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            target/assess-*.jar
